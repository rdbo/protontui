[package]
name = "protontui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for Proton VPN: sign in, browse servers, connect the whole host over WireGuard"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
# Userspace WireGuard, used only when the kernel module is missing (T3.2).
boringtun = { version = "0.7.1", features = ["device"] }
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "2.2.0"
futures = "0.3.34"
genetlink = "0.3.0"
netlink-packet-core = "0.9.0"
netlink-packet-generic = "0.5.0"
netlink-packet-wireguard = "0.5.0"
nix = { version = "0.31.3", features = ["user", "fs", "hostname", "signal", "process", "inotify"] }
rand = "0.8.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rpassword = "7.5.4"
# The same rustls reqwest uses; alternative routing (T6.3) hands reqwest a config with a pinning verifier.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rtnetlink = "0.23.0"
# local-agent-rs calls `TcpKeepalive::with_retries`, which needs socket2's `all` feature but does not
# enable it (its own Cargo.lock hid that). Enabling it here fixes the build through feature unification.
socket2 = { version = "0.5.10", features = ["all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "net", "process", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# Reads the certificate's start time when the local agent finds it not yet valid (clock skew).
x509-parser = "0.16.0"

# Proton's own crates (PLAN.md §1), pinned to the commits of the reference clones next to this repo, so that CI
# and packaging build the same code without them.
proton-srp = { git = "https://github.com/ProtonMail/proton-crypto-rs", rev = "c468e282625206eda9b48d539949e6183b1da32a" }
# Optional (feature `local-agent`, on by default): the crate has no license, so distributable builds may leave
# it out (`--no-default-features`), losing only live feature changes, port forwarding and NetShield statistics.
local-agent-rs = { path = "../python-proton-vpn-local-agent/local_agent_rs", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream"] }
fuzzy-matcher = "0.3.7"

[features]
default = ["local-agent"]
local-agent = ["dep:local-agent-rs"]

[dev-dependencies]
curve25519-dalek = "4.1.3"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = true
strip = true
codegen-units = 1

# Signature checks on the ~19k-server list (T2.2) take minutes with unoptimized crypto; optimize just those crates.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
